<header class="app-topbar">
  <div class="topbar-inner">
    <a class="brand" routerLink="/mt910/dashboard">
      <span class="brand-logo" aria-hidden="true"></span>
      <span class="brand-text">Credit & Debit Confirmation</span>
    </a>
  </div>
</header>

<div class="app-container">
  <aside class="app-sidebar">
    <app-message-type-selector></app-message-type-selector>
  </aside>
  <main class="app-content">
    <router-outlet></router-outlet>
  </main>
</div>

<!-- Global loading overlay -->
<div *ngIf="loadingSvc.loading$ | async" class="global-loading-overlay">
  <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
</div>
